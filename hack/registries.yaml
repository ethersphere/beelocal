mirrors:
  k3d-registry.localhost:${REGISTRY_PORT}:
    endpoint:
    - http://k3d-registry.localhost:${REGISTRY_PORT}
  docker.io:
    endpoint:
    - http://k3d-registry.localhost:${REGISTRY_PORT}
    rewrite:
      "^rancher/(.*)": "rancher/$1"
      "^ethereum/(.*)": "ethereum/$1"
configs: {}
auths: {}
